# Oliver Atwood — site editor settings
# Sign in at oliveratwood.com/admin with a GitHub personal access token (see README).

backend:
  name: github
  repo: tdfarrell/oliveratwood
  branch: main
  commit_messages:
    create: "New {{collection}}: {{slug}}"
    update: "Edit {{collection}}: {{slug}}"
    delete: "Delete {{collection}}: {{slug}}"
    uploadMedia: "Upload {{path}}"
    deleteMedia: "Delete {{path}}"

site_url: https://oliveratwood.com
display_url: https://oliveratwood.com
logo_url: /images/editor-logo.svg

media_folder: src/images/uploads
public_folder: /images/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: episodes
    label: Serial Episodes
    label_singular: Episode
    description: One installment of a serial. Turn on "Draft" to save without publishing.
    folder: src/episodes
    create: true
    extension: md
    format: frontmatter
    slug: "{{fields.story}}-part-{{fields.number}}"
    summary: "{{title}} — Part {{number}} {{draft}}"
    sortable_fields:
      fields: [date, number, title]
      default:
        field: date
        direction: descending
    view_groups:
      - label: Story
        field: story
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - label: Serial
        name: story
        widget: relation
        collection: stories
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
      - label: Part number
        name: number
        widget: number
        value_type: int
        min: 1
        hint: The order this installment appears in its story (1, 2, 3…).
      - label: Title
        name: title
        widget: string
      - label: Publish date
        name: date
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
      - label: Draft
        name: draft
        widget: boolean
        default: false
        required: false
        hint: When on, this installment is saved but hidden from the site.
      - label: Cover for this part
        name: cover
        widget: image
        required: false
        hint: Optional. Leave empty to use the story's cover. Tall 2:3 images work best (about 1200 × 1800).
      - label: One-line teaser
        name: summary
        widget: string
        required: false
        hint: Shown on the home page and in link previews.
      - label: Previously…
        name: previously
        widget: text
        required: false
        hint: Optional recap shown at the top for returning readers.
      - label: Story text
        name: body
        widget: markdown
        hint: Use a line with three dashes (---) for a scene break.
      - label: Note from Oliver
        name: authorNote
        widget: text
        required: false
        hint: Optional note shown after the installment.

  - name: stories
    label: Serials
    label_singular: Serial
    description: Each serial story. Its contents page lists every published episode.
    folder: src/stories
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} ({{status}})"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Short description
        name: summary
        widget: text
        hint: One or two sentences for story lists and link previews.
      - label: Cover image
        name: cover
        widget: image
        required: false
        hint: Tall 2:3 paperback shape works best (about 1200 × 1800). Leave empty and the site draws a classic banded cover.
      - label: Spine color
        name: spine
        widget: color
        required: false
        hint: Color for this story's book spines, page band and drawn cover. Pick a color from your cover art.
      - label: Genre
        name: genre
        widget: string
        required: false
      - label: Status
        name: status
        widget: select
        options: [Ongoing, Complete, Hiatus]
        default: Ongoing
      - label: Release schedule
        name: schedule
        widget: string
        required: false
        hint: e.g. "New parts every Friday"
      - label: Display order
        name: order
        widget: number
        value_type: int
        required: false
        hint: Lower numbers appear first.
      - label: Hidden
        name: draft
        widget: boolean
        default: false
        required: false
        hint: Hide the whole story from the site.
      - label: Synopsis
        name: body
        widget: markdown
        required: false

  - name: shorts
    label: Short Stories
    label_singular: Short Story
    description: Complete, stand-alone stories (no installments). Turn on "Draft" to save without publishing.
    folder: src/short-stories
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{date}} {{draft}}"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - label: Title
        name: title
        widget: string
      - label: Publish date
        name: date
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
      - label: Draft
        name: draft
        widget: boolean
        default: false
        required: false
        hint: When on, this story is saved but hidden from the site.
      - label: One-line teaser
        name: summary
        widget: string
        required: false
        hint: Shown on the home page, story lists and link previews. If empty, the opening lines are used.
      - label: Cover image
        name: cover
        widget: image
        required: false
        hint: Optional. Tall 2:3 images work best (about 1200 × 1800). Leave empty and the site draws a banded cover.
      - label: Spine color
        name: spine
        widget: color
        required: false
        hint: Optional. Color for this story's spine on the shelf and its drawn cover.
      - label: Genre
        name: genre
        widget: string
        required: false
        hint: e.g. Micro-Fiction, Mystery, Literary
      - label: Story text
        name: body
        widget: markdown
        hint: Use a line with three dashes (---) for a scene break.
      - label: Note from Oliver
        name: authorNote
        widget: text
        required: false
        hint: Optional note shown after the story.

  - name: poems
    label: Poetry
    label_singular: Poem
    description: Poems. Type them exactly as you want them to appear; every line break is kept.
    folder: src/poetry
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{date}} {{draft}}"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - label: Title
        name: title
        widget: string
      - label: Publish date
        name: date
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
      - label: Draft
        name: draft
        widget: boolean
        default: false
        required: false
        hint: When on, this poem is saved but hidden from the site.
      - label: Dedication
        name: dedication
        widget: string
        required: false
        hint: Optional, e.g. "for my father". Shown under the title.
      - label: Epigraph
        name: epigraph
        widget: text
        required: false
        hint: Optional quotation shown above the poem.
      - label: Epigraph source
        name: epigraphSource
        widget: string
        required: false
      - label: Poem
        name: body
        widget: text
        hint: Each line on its own line. Leave a blank line between stanzas.
      - label: Preview line
        name: summary
        widget: string
        required: false
        hint: Optional. Shown in lists and link previews. If empty, the poem's first line is used.
      - label: Spine color
        name: spine
        widget: color
        required: false
        hint: Optional. Color for this poem's slim volume on the shelf.
      - label: Cover image
        name: cover
        widget: image
        required: false
        hint: Optional. Used on the home page when this is the newest piece, and in link previews.
      - label: Note from Oliver
        name: authorNote
        widget: text
        required: false
        hint: Optional note shown after the poem.

  - name: posts
    label: Blog
    label_singular: Blog Post
    description: Blog posts — news, notes on writing, or behind-the-scenes on a story. Turn on "Draft" to save without publishing.
    folder: src/blog
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{date}} {{draft}}"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - label: Title
        name: title
        widget: string
      - label: Publish date
        name: date
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
      - label: Draft
        name: draft
        widget: boolean
        default: false
        required: false
        hint: When on, this post is saved but hidden from the site.
      - label: About a serial
        name: story
        widget: relation
        collection: stories
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        required: false
        hint: Optional. Pick a serial if this post is about it. The post will link to the story and appear on the story's page.
      - label: Summary
        name: summary
        widget: string
        required: false
        hint: One line for the blog list and link previews. If empty, the opening words are used.
      - label: Header image
        name: image
        widget: image
        required: false
        hint: Optional image shown at the top of the post.
      - label: Header image description
        name: imageAlt
        widget: string
        required: false
        hint: A few words describing the image, for readers using screen readers.
      - label: Post
        name: body
        widget: markdown

  - name: pages
    label: Pages & Settings
    files:
      - name: about
        label: About page
        file: src/about.md
        fields:
          - { label: Layout, name: layout, widget: hidden, default: page.njk }
          - { label: Permalink, name: permalink, widget: hidden, default: /about/ }
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: markdown }
      - name: site
        label: Site settings
        file: src/_data/site.json
        format: json
        fields:
          - { label: Site title, name: title, widget: string }
          - { label: Tagline, name: tagline, widget: string, hint: The big line on the home page. }
          - { label: Description, name: description, widget: text, hint: Used by search engines and the RSS feed. }
          - { label: Author name, name: author, widget: string }
          - { label: Site address, name: url, widget: string }
          - label: Newsletter signup link
            name: newsletterUrl
            widget: string
            required: false
            hint: Paste a Buttondown, Substack or similar signup URL to show a Subscribe link in the footer.
